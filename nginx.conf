worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - "$request" $status $body_bytes_sent "$http_referer"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Connection pooling upstream
    upstream median_backend {
        server median:5000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self'; font-src 'self' data:;" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Request bodies are JSON plus cover uploads (MAX_UPLOAD_SIZE_MB,
        # default 20 MB). Unlimited bodies let a client stream gigabytes into
        # the backend before it could refuse them (SEC-003). Raise this if you
        # raise MAX_UPLOAD_SIZE_MB. Downloads (responses) are not affected.
        client_max_body_size 25m;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # JS/CSS — never cache so deploys are instant
        location ~* \.(css|js)$ {
            proxy_pass http://median_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }

        # Static assets (images, fonts) — cache 1 day
        location ~* \.(svg|png|jpg|ico|woff2?)$ {
            proxy_pass http://median_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 1d;
            add_header Cache-Control "public, no-transform";
        }

        # API — no caching
        location /api/ {
            proxy_pass http://median_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # The backend keys rate limits on X-Real-IP. Both headers are
            # overwritten with the TCP peer so a client-sent value never
            # reaches it ($proxy_add_x_forwarded_for appends to it — SEC-002).
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";

            # SSE support
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Cache-Control no-cache;
        }

        # Frontend SPA
        location / {
            proxy_pass http://median_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # The backend keys rate limits on X-Real-IP. Both headers are
            # overwritten with the TCP peer so a client-sent value never
            # reaches it ($proxy_add_x_forwarded_for appends to it — SEC-002).
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
        }
    }
}
